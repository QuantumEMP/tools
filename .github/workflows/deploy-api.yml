# Deploys api-server/ to Fly whenever it changes on main, so no local flyctl is
# needed. Requires a FLY_API_TOKEN repo secret (fly.io dashboard → Tokens).
name: Deploy API to Fly

on:
  push:
    branches: [main]
    paths: ['api-server/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

concurrency: deploy-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-server
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
